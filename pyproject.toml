[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "antragshelper"
version = "0.1.0"
description = "Quorum- und Statistik-Auswertung für Anträge auf antraege.gruene.de"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
antragshelper = "antragshelper.__main__:main"

[tool.setuptools.packages.find]
include = ["antragshelper*"]

[tool.setuptools.package-data]
antragshelper = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
