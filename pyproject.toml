[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "antragshelper"
version = "0.1.0"
description = "Quorum- und Statistik-Auswertung für Anträge auf antraege.gruene.de"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
# Browser-Tests (tests/ui): zusätzlich `python -m playwright install chromium`
ui = ["pytest-playwright>=0.5"]

[project.scripts]
antragshelper = "antragshelper.__main__:main"

[tool.setuptools.packages.find]
include = ["antragshelper*"]

[tool.setuptools.package-data]
antragshelper = ["templates/*.html", "templates/*.svg", "templates/*.xml", "static/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser-Tests laufen nur mit `pytest -m ui` (eigener CI-Job), nicht im Pages-Build
addopts = "-m 'not ui'"
markers = ["ui: Browser-Tests mit Playwright gegen eine statische Seite aus den Testdaten"]
