name: Tests

# Läuft bei jedem Pull Request und jedem Push auf main – vor dem Merge sichtbar als ✅/❌ am PR.
# Keine Abrufe bei antraege.gruene.de: Alle Tests arbeiten mit nachgebauten Seiten aus tests/fixtures,
# die Browser-Tests mit einer daraus gebauten statischen Seite auf localhost.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      - run: pytest -q

  ui:
    name: Browser-Tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev,ui]'

      - run: python -m playwright install --with-deps chromium

      - run: pytest -m ui -q
