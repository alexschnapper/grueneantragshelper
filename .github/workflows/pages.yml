name: GitHub Pages

# Sparsam gegenüber antraege.gruene.de:
# - jeder Lauf wird mit Anlass und Abrufen auf der Transparenzseite protokolliert
# - stündlich nur eine Prüfung (1 Abruf: Seite 1 des Aktivitäts-Protokolls, plus je 1 Abruf
#   pro Link in beobachtet.txt), verglichen mit static/stand.json der veröffentlichten Seite
# - Neubau nur bei Änderung; Quorum-Zahlen werden inkrementell geholt (nur neue Anträge)
# - einmal nachts ein Sicherheits-Build für Änderungen, die nicht im Protokoll stehen
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"   # Prüfung
    - cron: "41 2 * * *"   # nächtlicher Sicherheits-Build
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  STAND_URL: https://alexschnapper.github.io/grueneantragshelper/static/stand.json

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      anlass: ${{ steps.check.outputs.anlass }}
      abrufe: ${{ steps.check.outputs.abrufe }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Änderungen prüfen
        id: check
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:41 2 * * *") anlass="Nächtlicher Sicherheits-Build" ;;
            push:*)                anlass="Code-Änderung (Push auf main)" ;;
            workflow_dispatch:*)   anlass="Manuell gestartet" ;;
            *)                     anlass="" ;;
          esac
          if [ -n "$anlass" ]; then
            echo "Build erzwungen: $anlass"
            { echo "changed=true"; echo "anlass=$anlass"; echo "abrufe=0"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args="--vorher $STAND_URL"
          if [ -f beobachtet.txt ]; then args="$args --beobachten beobachtet.txt"; fi
          python -m antragshelper check $args

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: pip install -e '.[dev]'

      - name: Tests
        run: pytest -q

      - name: Statische Seite erzeugen
        env:
          ANLASS: ${{ needs.check.outputs.anlass }}
          ABRUFE: ${{ needs.check.outputs.abrufe }}
        run: |
          set -- --out _site --details --vorher "$STAND_URL" --anlass "$ANLASS" --pruef-abrufe "${ABRUFE:-0}"
          if [ -f beobachtet.txt ]; then set -- "$@" --beobachten beobachtet.txt; fi
          python -m antragshelper build "$@"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
