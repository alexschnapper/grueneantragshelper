{% macro bar(value, label) -%}
<div class="bar" role="progressbar" aria-label="{{ label }}" aria-valuenow="{{ (value * 100)|round|int }}" aria-valuemin="0" aria-valuemax="100">
  <span style="width: {{ (value * 100)|round(1) }}%"></span>
</div>
{%- endmacro %}

{% macro summary(q) -%}
{% if q.reached %}
  <strong class="ok">Quorum erreicht</strong> (mindestens {{ q.min_total }})
{% else %}
  <strong>{{ q.still_needed }}</strong> fehlen{% if q.min_women is not none %}, davon mindestens <strong>{{ q.missing_women }}</strong> Frauen{% endif %}
{% endif %}
{%- endmacro %}
